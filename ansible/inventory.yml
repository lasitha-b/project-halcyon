all:
  # Addressing is segmented by the pfSense edge firewall (fw01):
  #   LAN 10.20.10.0/24  (libvirt "lab-lan")  dc01/srv01/ws01/ws02
  #   DMZ 172.20.1.0/24  (libvirt "lab-dmz")  web01
  #   WAN 192.168.50.0/24 (libvirt "lab-wan") attack
  # These IPs are deterministic (pfSense static-MAC DHCP mappings, mirrored in
  # packer/pfsense/config.xml), so this file is the source of truth. The
  # Ansible control node reaches every host directly over the host's .1
  # management adapter on each libvirt network, regardless of firewall rules.
  vars:
    domain_name: corp.halcyon.local
    domain_netbios: HALCYON
    org_name: "Halcyon Logistics"

  children:
    windows:
      vars:
        ansible_connection: winrm
        ansible_user: vagrant
        ansible_password: vagrant # bootstrap only; rotated by randomize role
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_port: 5985
      children:
        domain_controllers:
          hosts:
            dc01:
              ansible_host: 10.20.10.10
        member_servers:
          hosts:
            srv01:
              ansible_host: 10.20.10.20
        clients:
          hosts:
            ws01:
              ansible_host: 10.20.10.31
            ws02:
              ansible_host: 10.20.10.32

    linux:
      vars:
        ansible_connection: ssh
        ansible_user: vagrant
        ansible_password: vagrant # bootstrap only; rotated by randomize role
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no"
        ansible_become: true # vagrant has passwordless sudo (autoinstall late-command)
      hosts:
        web01:
          ansible_host: 172.20.1.40 # DMZ (vmnet21)

    attacker:
      vars:
        ansible_connection: ssh
        ansible_user: kali
        ansible_password: kali # standard Kali image default; change if this VM's was customized
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no"
      hosts:
        attack:
          ansible_host: 192.168.50.66 # WAN (vmnet22)
