---
# SRV01: install MSSQL Express (real install left to a chocolatey step since
# there's no first-party Ansible MSSQL-installer module), configure the
# service account/SPN, enable xp_cmdshell, and optionally add a linked server.
#
# All T-SQL is run via `sqlcmd` over win_shell rather than a community SQL
# module - there is no well-maintained Ansible module for running arbitrary
# scripts against MSSQL, and sqlcmd is guaranteed present with the engine.

- name: Ensure Chocolatey is installed
  chocolatey.chocolatey.win_chocolatey:
    name: chocolatey
    state: present

- name: Install SQL Server Express
  # SQL Setup fails under a WinRM network logon ("There was an error
  # generating the XML document", exit 0x84B10001); run it as SYSTEM via become.
  chocolatey.chocolatey.win_chocolatey:
    name: sql-server-express
    state: present
  become: true
  become_method: runas
  become_user: SYSTEM

- name: Grant BUILTIN\Administrators sysadmin (setup ran as SYSTEM, so it was the only sysadmin)
  ansible.windows.win_shell: |
    sqlcmd -S localhost\SQLEXPRESS -E -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = 'BUILTIN\Administrators') CREATE LOGIN [BUILTIN\Administrators] FROM WINDOWS; ALTER SERVER ROLE sysadmin ADD MEMBER [BUILTIN\Administrators];"
  become: true
  become_method: runas
  become_user: SYSTEM
  changed_when: true

- name: Install SQL Server Management Studio (for lab admin convenience, not required by attackers)
  chocolatey.chocolatey.win_chocolatey:
    name: sql-server-management-studio
    state: present
  ignore_errors: true

- name: Enable SQL Server + Windows mixed-mode authentication and set the sa password
  ansible.windows.win_shell: |
    # Setting LoginMode via SMO ($srv.Alter()) was unreliable here (silently
    # left LoginMode=1/Windows-only in some runs). This is the same registry
    # key SSMS/SMO write under the hood - set it directly instead.
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.SQLEXPRESS\MSSQLServer' -Name LoginMode -Value 2

    # SQL Server Express ships with the TCP/IP protocol disabled (named
    # pipes/shared memory only) - remote/network connections (incl. from
    # ATTACK once pivoted) need TCP on the standard port 1433 explicitly
    # enabled, same as toggling it on in SQL Server Configuration Manager.
    $tcpPath = 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\MSSQL16.SQLEXPRESS\MSSQLServer\SuperSocketNetLib\Tcp'
    Set-ItemProperty -Path $tcpPath -Name Enabled -Value 1
    Get-ChildItem $tcpPath | Where-Object { $_.PSChildName -like 'IP*' } | ForEach-Object {
      Set-ItemProperty -Path $_.PSPath -Name TcpPort -Value '1433'
      Set-ItemProperty -Path $_.PSPath -Name TcpDynamicPorts -Value ''
    }

    Restart-Service -Name 'MSSQL$SQLEXPRESS' -Force

    # SQL Express can take well over 5s to accept connections after a
    # restart - poll instead of a fixed sleep, and fail loudly (not just a
    # hardcoded changed_when) if it never comes up.
    $ready = $false
    for ($i = 0; $i -lt 24; $i++) {
      Start-Sleep -Seconds 5
      sqlcmd -S localhost\SQLEXPRESS -Q "SELECT 1" *> $null
      if ($LASTEXITCODE -eq 0) { $ready = $true; break }
    }
    if (-not $ready) { throw "SQL Server did not come back up after mixed-mode restart" }

    sqlcmd -S localhost\SQLEXPRESS -b -Q "ALTER LOGIN sa WITH PASSWORD = '{{ halcyon_sa_mssql_password }}'; ALTER LOGIN sa ENABLE;"
    if ($LASTEXITCODE -ne 0) { throw "Failed to set sa password/enable sa login" }
  changed_when: true

- name: Create domain service account context for MSSQL engine (svc-mssql runs the service)
  ansible.windows.win_shell: |
    # Set-Service in Windows PowerShell 5.1 has no -Credential parameter, so the
    # previous Set-Service call failed silently and the engine stayed on its
    # virtual account. sc.exe works on every Windows version.
    sc.exe config 'MSSQL$SQLEXPRESS' obj= '{{ domain_netbios }}\svc-mssql' password= '{{ halcyon_creds['svc-mssql'] }}'
    if ($LASTEXITCODE -ne 0) { throw "sc.exe config failed ($LASTEXITCODE)" }
    Restart-Service -Name 'MSSQL$SQLEXPRESS' -Force
    # Give the engine time to leave script-upgrade mode before later tasks log in.
    for ($i = 0; $i -lt 24; $i++) {
      Start-Sleep -Seconds 5
      sqlcmd -S localhost\SQLEXPRESS -E -Q "SELECT 1" *> $null
      if ($LASTEXITCODE -eq 0) { break }
    }
  changed_when: true

- name: Grant svc-mssql SeImpersonatePrivilege (already default for LocalSystem-adjacent service accounts, explicit here for the potato-style privesc path)
  # ntrights.exe (Server 2003 Resource Kit) doesn't exist on Server 2022;
  # secedit is the modern way to edit user rights assignments.
  ansible.windows.win_shell: |
    $sid = (New-Object System.Security.Principal.NTAccount("{{ domain_netbios }}\svc-mssql")).Translate([System.Security.Principal.SecurityIdentifier]).Value
    $cfg = "$env:TEMP\secpol.cfg"
    secedit /export /cfg $cfg /areas USER_RIGHTS | Out-Null
    $content = @(Get-Content $cfg)
    $found = $false
    for ($i = 0; $i -lt $content.Length; $i++) {
      if ($content[$i] -match '^SeImpersonatePrivilege\s*=\s*(.*)$') {
        $found = $true
        $existing = $Matches[1]
        if ($existing -notmatch [regex]::Escape("*$sid")) {
          $content[$i] = "SeImpersonatePrivilege = $existing,*$sid"
        }
      }
    }
    if (-not $found) { $content += "SeImpersonatePrivilege = *$sid" }
    $content | Set-Content $cfg
    secedit /configure /db "$env:TEMP\secedit.sdb" /cfg $cfg /areas USER_RIGHTS | Out-Null
  changed_when: true

- name: Enable xp_cmdshell (always-live path)
  # Passing the password via -P on the command line is fragile: Windows
  # PowerShell 5.1's native-argument passing can mangle shell-special
  # characters (&, %, etc.) that a generated password may contain. sqlcmd
  # natively reads SQLCMDPASSWORD instead, avoiding that entirely.
  ansible.windows.win_shell: |
    $env:SQLCMDPASSWORD = "{{ halcyon_sa_mssql_password }}"
    sqlcmd -S localhost\SQLEXPRESS -U sa -Q "EXEC sp_configure 'show advanced options', 1; RECONFIGURE; EXEC sp_configure 'xp_cmdshell', 1; RECONFIGURE;"
  when: "'mssql_xp_cmdshell' in halcyon_live_paths"
  changed_when: true

- name: Configure a linked server back to DC01 using svc-mssql's context (EXECUTE AS abuse path)
  ansible.windows.win_shell: |
    $env:SQLCMDPASSWORD = "{{ halcyon_sa_mssql_password }}"
    sqlcmd -S localhost\SQLEXPRESS -U sa -Q "EXEC sp_addlinkedserver @server = N'DC01LINK', @srvproduct=N'', @provider=N'SQLNCLI', @datasrc=N'dc01.{{ domain_name }}'; EXEC sp_addlinkedsrvlogin @rmtsrvname=N'DC01LINK', @useself=N'True';"
  when: "'mssql_linked_server' in halcyon_live_paths"
  changed_when: true

- name: Create the CI deploy share referenced by WEB01's deploy.sh
  ansible.windows.win_shell: |
    New-Item -ItemType Directory -Path 'C:\Shares\Deploy' -Force | Out-Null
    if (-not (Get-SmbShare -Name "deploy" -ErrorAction SilentlyContinue)) {
      New-SmbShare -Name "deploy" -Path 'C:\Shares\Deploy' -FullAccess "{{ domain_netbios }}\svc-deploy","{{ domain_netbios }}\Domain Admins"
    }
  changed_when: true

- name: Drop the first-domain-cred flag + a decoy release note in the deploy share
  ansible.windows.win_shell: |
    Set-Content -Path 'C:\Shares\Deploy\flag_first_domain_cred.txt' -Value "{{ halcyon_flags.first_domain_cred }}"
    Set-Content -Path 'C:\Shares\Deploy\README.txt' -Value "intranet-latest.tar.gz is built by CI - if missing, trigger a manual deploy run."
  changed_when: true
